PACKAGE_NAME="a2tp"
PACKAGE_VERSION="@VER@"
# 在 dkms 构建目录（= /usr/src/a2tp-@VER@）里调仓库自己的 kmod 目标；
# kernel/a2tp.h include 了 ../src/{proto,kapi}.h，所以源码树必须带 src/
MAKE[0]="make kmod KDIR=/lib/modules/${kernelver}/build"
BUILT_MODULE_NAME[0]="a2tp"
BUILT_MODULE_LOCATION[0]="kernel/"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
